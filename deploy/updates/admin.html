</style></head><body><h1>Faethon release publisher</h1><p>Upload the installer, blockmap, and latest.yml from one reviewed Windows build. Files stay staged until you select Publish. The publishing token is kept only in this page while it is open.</p>

<button id="upload">Upload selected files</button> <button id="publish">Publish reviewed release</button><pre id="status" role="status"></pre><script src="/admin.js"></script></body></html>
